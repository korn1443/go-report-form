<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบฟอร์มรายงานการไปราชการ</title>
    <style>
        body {
            font-family: 'TH Sarabun New', 'Sarabun', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #0056b3;
        }
        .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo img {
            max-height: 100px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 16px;
        }
        textarea {
            height: 100px;
            resize: vertical;
        }
        button {
            background: #0056b3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }
        button:hover {
            background: #003d82;
        }
        .buttons {
            text-align: center;
            margin-top: 20px;
        }
        .table-expenses {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        .table-expenses th, .table-expenses td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        .table-expenses th {
            background-color: #f2f2f2;
        }
        .expense-row td {
            padding: 5px;
        }
        .add-row {
            background: #28a745;
        }
        .add-row:hover {
            background: #218838;
        }
        .print-area {
            background: white;
            padding: 20px;
            margin-top: 30px;
            border: 1px solid #ddd;
            display: none;
        }
        .header-print {
            text-align: center;
            margin-bottom: 20px;
        }
        .official-form {
            border: 1px solid #000;
            padding: 20px;
            position: relative;
        }
        .garuda {
            text-align: center;
            margin-bottom: 15px;
        }
        .garuda img {
            height: 100px;
        }
        .form-header {
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 20px;
        }
        .form-details {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .section-title {
            font-weight: bold;
            margin-top: 10px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
        }
        .text-center {
            text-align: center;
        }
        .text-right {
            text-align: right;
        }
        .signature {
            margin-top: 50px;
            text-align: right;
            padding-right: 100px;
        }
        @media print {
            .container:not(.print-area) {
                display: none;
            }
            .print-area {
                display: block !important;
                border: none;
            }
            button {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="https://img2.pic.in.th/pic/RJ-6.jpg" alt="โลโก้หน่วยงาน">
        </div>
        <h1>แบบฟอร์มรายงานการไปราชการ</h1>
        
        <div class="form-group">
            <label for="officer">ชื่อ-นามสกุล:</label>
            <input type="text" id="officer" placeholder="กรุณาระบุชื่อ-นามสกุล">
        </div>
        
        <div class="form-group">
            <label for="position">ตำแหน่ง:</label>
            <input type="text" id="position" placeholder="กรุณาระบุตำแหน่ง">
        </div>
        
        <div class="form-group">
            <label for="department">สังกัด:</label>
            <input type="text" id="department" placeholder="กรุณาระบุสังกัด">
        </div>
        
        <div class="form-group">
            <label for="docno">เลขที่คำสั่ง/หนังสือ:</label>
            <input type="text" id="docno" placeholder="กรุณาระบุเลขที่คำสั่ง/หนังสือ">
        </div>
        
        <div class="form-group">
            <label for="date">ลงวันที่:</label>
            <input type="date" id="date">
        </div>
        
        <div class="form-group">
            <label for="purpose">วัตถุประสงค์การไปราชการ:</label>
            <textarea id="purpose" placeholder="กรุณาระบุวัตถุประสงค์การไปราชการ"></textarea>
        </div>
        
        <div class="form-group">
            <label for="location">สถานที่:</label>
            <input type="text" id="location" placeholder="กรุณาระบุสถานที่">
        </div>
        
        <div class="form-group">
            <label for="start-date">วันที่เริ่มต้น:</label>
            <input type="date" id="start-date">
        </div>
        
        <div class="form-group">
            <label for="end-date">วันที่สิ้นสุด:</label>
            <input type="date" id="end-date">
        </div>
        
        <div class="form-group">
            <label>ค่าใช้จ่าย:</label>
            <table class="table-expenses" id="expense-table">
                <thead>
                    <tr>
                        <th>รายการ</th>
                        <th>จำนวนเงิน (บาท)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="expense-row">
                        <td><input type="text" placeholder="ระบุรายการ"></td>
                        <td><input type="number" placeholder="0.00" step="0.01"></td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="2">
                            <button type="button" class="add-row" onclick="addExpenseRow()">+ เพิ่มรายการ</button>
                        </td>
                    </tr>
                    <tr>
                        <td class="text-right"><strong>รวมทั้งสิ้น:</strong></td>
                        <td id="total-expense">0.00 บาท</td>
                    </tr>
                </tfoot>
            </table>
        </div>
        
        <div class="form-group">
            <label for="summary">สรุปผลการไปราชการ:</label>
            <textarea id="summary" placeholder="กรุณาสรุปผลการไปราชการ"></textarea>
        </div>
        
        <div class="form-group">
            <label for="report-date">วันที่รายงาน:</label>
            <input type="date" id="report-date">
        </div>
        
        <div class="buttons">
            <button type="button" onclick="generateReport()">สร้างรายงาน</button>
            <button type="button" onclick="printReport()">พิมพ์รายงาน</button>
            <button type="button" onclick="resetForm()">ล้างข้อมูล</button>
        </div>
        
        <!-- พื้นที่สำหรับพิมพ์ -->
        <div class="print-area" id="print-area">
            <!-- เนื้อหาจะถูกเพิ่มด้วย JavaScript -->
        </div>
    </div>

    <script>
        // เพิ่มแถวรายการค่าใช้จ่าย
        function addExpenseRow() {
            const tableBody = document.querySelector('#expense-table tbody');
            const newRow = document.createElement('tr');
            newRow.className = 'expense-row';
            newRow.innerHTML = `
                <td><input type="text" placeholder="ระบุรายการ"></td>
                <td><input type="number" placeholder="0.00" step="0.01"></td>
            `;
            tableBody.appendChild(newRow);
            
            // เพิ่ม event listener สำหรับการคำนวณยอดรวม
            const inputFields = newRow.querySelectorAll('input[type="number"]');
            inputFields.forEach(input => {
                input.addEventListener('input', calculateTotal);
            });
        }
        
        // คำนวณยอดรวมค่าใช้จ่าย
        function calculateTotal() {
            const expenseInputs = document.querySelectorAll('#expense-table tbody input[type="number"]');
            let total = 0;
            
            expenseInputs.forEach(input => {
                total += parseFloat(input.value) || 0;
            });
            
            document.getElementById('total-expense').textContent = total.toFixed(2) + ' บาท';
        }
        
        // เพิ่ม event listener เริ่มต้น
        document.addEventListener('DOMContentLoaded', function() {
            const initialExpenseInputs = document.querySelectorAll('#expense-table tbody input[type="number"]');
            initialExpenseInputs.forEach(input => {
                input.addEventListener('input', calculateTotal);
            });
            
            // ตั้งค่าวันที่ปัจจุบัน
            const today = new Date();
            const formattedDate = today.toISOString().split('T')[0];
            document.getElementById('report-date').value = formattedDate;
        });
        
        // สร้างรายงาน
        function generateReport() {
            const officer = document.getElementById('officer').value;
            const position = document.getElementById('position').value;
            const department = document.getElementById('department').value;
            const docno = document.getElementById('docno').value;
            const date = document.getElementById('date').value;
            const purpose = document.getElementById('purpose').value;
            const location = document.getElementById('location').value;
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            const summary = document.getElementById('summary').value;
            const reportDate = document.getElementById('report-date').value;
            
            // ตรวจสอบข้อมูลที่จำเป็น
            if (!officer || !position || !department || !docno || !date || !purpose || !location || !startDate || !endDate || !summary || !reportDate) {
                alert('กรุณากรอกข้อมูลให้ครบถ้วน');
                return;
            }
            
            // สร้างตารางค่าใช้จ่าย
            let expensesHtml = '';
            let total = 0;
            const expenseRows = document.querySelectorAll('#expense-table tbody tr');
            
            expenseRows.forEach(row => {
                const itemName = row.querySelector('input[type="text"]').value;
                const itemAmount = parseFloat(row.querySelector('input[type="number"]').value) || 0;
                
                if (itemName) {
                    expensesHtml += `
                        <tr>
                            <td>${itemName}</td>
                            <td class="text-right">${itemAmount.toFixed(2)} บาท</td>
                        </tr>
                    `;
                    total += itemAmount;
                }
            });
            
            // แปลงรูปแบบวันที่
            const formatDate = (dateStr) => {
                if (!dateStr) return '';
                const date = new Date(dateStr);
                return date.toLocaleDateString('th-TH', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            };
            
            // สร้าง HTML สำหรับพิมพ์
            const printArea = document.getElementById('print-area');
            printArea.innerHTML = `
                <div class="official-form">
                    
                    <div class="form-header">
                        บันทึกข้อความ
                    </div>
                     
                    <div>
                        <img src="https://img5.pic.in.th/file/secure-sv1/1ed6e64eb2cb6c9c150ef4183854535f.png" style="width: 113px; height: auto;" alt="ตราครุฑ" class="left-image"> 
                    </div>
                    
                    <div class="form-details">
                        <div><strong>ส่วนราชการ</strong> โรงเรียนร่วมจิตต์วิทยา อำเภอละหานทราย จังหวัดบุรีรัมย์</div>
                        <div><strong>วันที่</strong> ${formatDate(reportDate)}</div>
                    </div>
                    
                    <div class="section-title">
                        <strong>เรื่อง</strong> รายงานผลการไปราชการ
                    </div>
                    
                    <div class="section-title">
                        <strong>เรียน</strong> ผู้อำนวยการโรงเรียนร่วมจิตต์วิทยา
                    </div>
                    
                    <p>ตามคำสั่ง/หนังสือ เลขที่ ${docno} ลงวันที่ ${formatDate(date)} ได้อนุมัติให้ข้าพเจ้า ${officer} ตำแหน่ง ${position} สังกัด ${department} ไปราชการเพื่อ ${purpose} ณ ${location} ตั้งแต่วันที่ ${formatDate(startDate)} ถึงวันที่ ${formatDate(endDate)} นั้น</p>
                    <p style="text-indent: 2em;"></p>
                    
                    <p style="text-indent: 2em;">บัดนี้ การไปราชการได้เสร็จสิ้นแล้ว ข้าพเจ้าขอรายงานผลการไปราชการ ดังนี้</p>
                    
                              <p>${summary}</p>
                    
                    <h3>ค่าใช้จ่ายในการไปราชการ</h3>
                    <table class="table-expenses">
                        <thead>
                            <tr>
                                <th>รายการ</th>
                                <th>จำนวนเงิน (บาท)</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${expensesHtml}
                        </tbody>
                        <tfoot>
                            <tr>
                                <td class="text-right"><strong>รวมทั้งสิ้น</strong></td>
                                <td class="text-right"><strong>${total.toFixed(2)} บาท</strong></td>
                            </tr>
                        </tfoot>
                    </table>
                    
                    <div class="signature">
                        <p>ลงชื่อ ................................................</p>
                        <p>(${officer})</p>
                        <p>ตำแหน่ง ${position}</p>
                        <p>วันที่ ${formatDate(reportDate)}</p>
                    </div>
                    
                    <div style="margin-top: 50px; border-top: 1px dashed #999; padding-top: 15px;">
                        <p><strong>ความเห็นของผู้บริหาร</strong></p>
                        <p>................................................................</p>
                        <p>................................................................</p>
                        <p>................................................................</p>
                        
                        <div class="signature">
                            <p>ลงชื่อ ........................</p>
                            <p>(นายนิกรณ์ ปักกาสาร)</p>
                            <p>ผู้อำนวยการโรงเรียนร่วมจิตต์วิทยา</p>
                            <p>วันที่.....เดือน...........พ.ศ........</p>
                        </div>
                    </div>
                </div>
            `;
            
            printArea.style.display = 'block';
        }
        
        // พิมพ์รายงาน
        function printReport() {
            if (document.getElementById('print-area').innerHTML.trim() === '') {
                alert('กรุณาสร้างรายงานก่อนพิมพ์');
                return;
            }
            window.print();
        }
        
        // ล้างข้อมูลทั้งหมด
        function resetForm() {
            document.querySelectorAll('input, textarea').forEach(input => {
                input.value = '';
            });
            
            // ล้างตารางค่าใช้จ่าย แต่เหลือแถวเริ่มต้นไว้ 1 แถว
            const tableBody = document.querySelector('#expense-table tbody');
            tableBody.innerHTML = `
                <tr class="expense-row">
                    <td><input type="text" placeholder="ระบุรายการ"></td>
                    <td><input type="number" placeholder="0.00" step="0.01"></td>
                </tr>
            `;
            
            // เพิ่ม event listener อีกครั้ง
            const initialExpenseInputs = document.querySelectorAll('#expense-table tbody input[type="number"]');
            initialExpenseInputs.forEach(input => {
                input.addEventListener('input', calculateTotal);
            });
            
            // รีเซ็ตยอดรวม
            document.getElementById('total-expense').textContent = '0.00 บาท';
            
            // ซ่อนพื้นที่พิมพ์
            document.getElementById('print-area').style.display = 'none';
            
            // ตั้งค่าวันที่ปัจจุบันอีกครั้ง
            const today = new Date();
            const formattedDate = today.toISOString().split('T')[0];
            document.getElementById('report-date').value = formattedDate;
        }
    </script>
</body>
</html>
